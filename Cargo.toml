[package]
name = "ropy"
version = "0.5.0-beta"
edition = "2024"
description = "A clipboard manager built with Rust and GPUI."
authors = ["Student Wei <studentweis@gmail.com>"]
repository = "https://github.com/StudentWeis/ropy"
keywords = ["clipboard", "gpui", "productivity"]
categories = ["productivity"]
license = "MIT"

[dependencies]
clipboard-rs = "0.3.4"
gpui = { version = "0.2.2", default-features = false }
gpui-component = { version = "0.5.1", default-features = false }
global-hotkey = "0.7.0"
sled = "0.34.7"
redb = "4.0.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
postcard = { version = "1.1.3", features = ["alloc"] }
chrono = { version = "0.4.44", default-features = false, features = [
    "clock",
    "serde",
    "std",
] }
dirs = "6.0.0"
thiserror = "2.0.18"
config = { version = "0.15.22", default-features = false, features = ["toml"] }
toml = "1.1.2"
image = { version = "0.25.10", default-features = false, features = ["png"] }
tray-icon = "0.22.0"
auto-launch = "0.6.0"
raw-window-handle = "0.6.2"
async-channel = "2.5.0"
rust-embed = "8.11.0"
seahash = "4.1.0"
sha2 = "0.11.0"
self-replace = "1.5.0"
semver = "1.0.28"
hex = "0.4.3"
tempfile = "3.27.0"
enigo = "0.6.1"

# Logging / tracing
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-log = "0.2.0"
tracing-subscriber = { version = "0.3.23", default-features = false, features = [
    "env-filter",
    "fmt",
    "json",
    "std",
    "time",
] }
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
] }
zip = "8.5.1"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18.2"
x11rb = "0.13.2"

[target.'cfg(not(target_os = "windows"))'.dependencies]
tar = "0.4.45"
xz2 = { version = "0.1.7", features = ["static"] }

[target.'cfg(target_os = "windows")'.build-dependencies]
winres = "0.1.12"
image = { version = "0.25.10", default-features = false, features = [
    "ico",
    "png",
] }

[dev-dependencies]
rstest = "0.26.1"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
print_stdout = "warn"
print_stderr = "warn"
undocumented_unsafe_blocks = "warn"
module_name_repetitions = "allow"
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
derive_partial_eq_without_eq = "allow"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
incremental = false
panic = "abort"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

[package.metadata.release]
tag-name = "{{version}}"
pre-release-commit-message = "chore(release): release {{crate_name}} {{version}}"
pre-release-hook = ["bash", "scripts/release_prepare.sh"]

[[package.metadata.release.pre-release-replacements]]
file = "Cargo.toml"
search = '(\[package\.metadata\.bundle\.bin\.ropy\]\n(?:.*\n)*?version\s*=\s*")[^"]*"'
replace = '${1}{{version}}"'
exactly = 1

[package.metadata.bundle]
name = "Ropy"
identifier = "com.ropy.app"
icon = ["assets/logo.png"]
resources = ["assets/locales"]
osx_minimum_system_version = "10.15"

# macOS specific settings
[package.metadata.bundle.bin.ropy]
name = "Ropy"
version = "0.5.0-beta"
copyright = "Copyright 2026 Ropy Team"
category = "Productivity"
short_description = "A clipboard manager"
long_description = "A clipboard manager built with Rust and GPUI."
