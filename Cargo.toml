[package]
name = "ropy"
version = "0.2.0"
edition = "2024"
description = "A clipboard manager built with Rust and GPUI."
repository = "https://github.com/StudentWeis/ropy"
license = "MIT"

[dependencies]
clipboard-rs = "0.3.2"
gpui = "0.2.2"
gpui-component = "0.5.0"
sysinfo = "0.38.0"
global-hotkey = "0.7"
sled = "0.34"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.149"
chrono = { version = "0.4.43", features = ["serde"] }
dirs = "6.0"
thiserror = "2.0.18"
config = "0.15"
toml = "0.9.8"
image = "0.25"
tray-icon = "0.21.3"
dark-light = "2.0"
auto-launch = "0.6.0"
regex = "1.12.2"
raw-window-handle = "0.6"
async-channel = "2.5.0"
rust-embed = "8.11.0"

# Logging / tracing
tracing = "0.1"
tracing-appender = "0.2"
tracing-log = "0.2"
tracing-subscriber = { version = "0.3", features = [
    "env-filter",
    "json",
    "time",
] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.3"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
] }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18.2"
x11rb = "0.13"

[dev-dependencies]
tempfile = "3.24.0"

[build-dependencies]
winres = "0.1"
image = "0.25"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
print_stdout = "warn"
print_stderr = "warn"
module_name_repetitions = "allow"
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
derive_partial_eq_without_eq = "allow"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

[package.metadata.bundle]
name = "Ropy"
identifier = "com.ropy.app"
version = "0.2.0"
copyright = "Copyright 2025 Ropy Team"
category = "Productivity"
short_description = "A clipboard manager"
long_description = "A clipboard manager built with Rust and GPUI."
codesign_identity = "adhoc"
