[package]
name = "ropy"
version = "0.5.1"
edition = "2024"
description = "A clipboard manager built with Rust and GPUI."
authors = ["Student Wei <studentweis@gmail.com>"]
repository = "https://github.com/StudentWeis/ropy"
keywords = ["clipboard", "gpui", "productivity"]
categories = ["productivity"]
license = "MIT"
publish = false

[dependencies]
clipboard-rs = "0.3.4"
gpui = { version = "0.2.2", default-features = false }
gpui-component = { version = "0.5.1", default-features = false }
global-hotkey = "0.8.0"
redb = "4.1.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
postcard = { version = "1.1.3", features = ["alloc"] }
chrono = { version = "0.4.44", default-features = false, features = [
    "clock",
    "serde",
    "std",
] }
dirs = "6.0.0"
thiserror = "2.0.18"
toml = "1.1.2"
image = { version = "0.25.10", default-features = false, features = ["png"] }
tray-icon = "0.24.0"
auto-launch = "0.6.0"
raw-window-handle = "0.6.2"
async-channel = "2.5.0"
rust-embed = "8.11.0"
seahash = "4.1.0"
sha2 = "0.11.0"
self-replace = "1.5.0"
semver = "1.0.28"
tempfile = "3.27.0"
enigo = "0.6.1"

# Logging / tracing
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-log = "0.2.0"
tracing-subscriber = { version = "0.3.23", default-features = false, features = [
    "env-filter",
    "fmt",
    "json",
    "std",
    "time",
] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
] }
zip = "8.6.0"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18.2"
x11rb = "0.13.2"

[target.'cfg(not(target_os = "windows"))'.dependencies]
tar = "0.4.45"
xz2 = { version = "0.1.7", features = ["static"] }

[target.'cfg(target_os = "windows")'.build-dependencies]
winres = "0.1.12"
image = { version = "0.25.10", default-features = false, features = [
    "ico",
    "png",
] }

[dev-dependencies]
rstest = "0.26.1"
serial_test = "3.4.0"

[lints.rust]
# Code quality
missing_debug_implementations = "deny"
missing_docs = "warn"
unreachable_pub = "deny"
unnameable_types = "deny"

# Unsafe discipline
unsafe_op_in_unsafe_fn = "deny"
missing_unsafe_on_extern = "deny"
unsafe_attr_outside_unsafe = "deny"

# Import & path hygiene
absolute_paths_not_starting_with_crate = "deny"
redundant_imports = "deny"
unused_qualifications = "deny"

# Lifetime & type clarity
elided_lifetimes_in_paths = "deny"
single_use_lifetimes = "deny"
redundant_lifetimes = "deny"
trivial_casts = "deny"
trivial_numeric_casts = "deny"

# Future compatibility & edition hygiene
keyword_idents_2024 = "deny"
rust_2024_incompatible_pat = "deny"
rust_2024_prelude_collisions = "deny"

# Unused items
unused_import_braces = "deny"
unused_lifetimes = "deny"
unused_macro_rules = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }

# Cargo lints
cargo = { level = "deny", priority = -1 }
multiple_crate_versions = "allow"

# Restriction lints
allow_attributes = "deny"
dbg_macro = "deny"
todo = "deny"
panic = "deny"
unwrap_used = "deny"
expect_used = "deny"
print_stdout = "deny"
print_stderr = "deny"
undocumented_unsafe_blocks = "deny"
mod_module_files = "deny"
empty_drop = "deny"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"

[package.metadata.dist]
dist = true

[package.metadata.release]
tag-name = "{{version}}"
pre-release-commit-message = "chore(release): release {{crate_name}} {{version}}"
pre-release-hook = ["bash", "scripts/release_prepare.sh"]

# macOS specific settings
[package.metadata.bundle]
name = "Ropy"
identifier = "com.ropy.app"
icon = ["assets/logo.png"]
osx_minimum_system_version = "10.15"

[package.metadata.bundle.bin.ropy]
name = "Ropy"
version = "0.5.1"
copyright = "Copyright 2026 Ropy Team"
category = "Productivity"
short_description = "A clipboard manager"
long_description = "A clipboard manager built with Rust and GPUI."
