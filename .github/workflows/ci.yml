name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  precheck:
    name: Precheck (fmt + clippy + test + i18n/icons/themes)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install nightly rustfmt
        run: rustup toolchain install nightly --profile minimal --component rustfmt

      - name: Install pinned stable toolchain with clippy
        # rust-toolchain.toml pins the stable channel, but rustup only installs
        # the bare cargo/rustc on first use — clippy must be added explicitly,
        # otherwise scripts/precheck.sh's clippy step fails on a fresh runner.
        run: rustup show active-toolchain || rustup toolchain install --profile minimal --component clippy

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libatk1.0-dev \
            libgtk-3-dev \
            libgdk-pixbuf2.0-dev \
            libcairo2-dev \
            libpango1.0-dev \
            libxdo-dev \
            libxkbcommon-x11-dev

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Cache cargo registry & target
        uses: Swatinem/rust-cache@v2

      - name: Run precheck (CI mode)
        run: ./scripts/precheck.sh --check

  cross-build:
    name: Cross-platform build (${{ matrix.os }})
    needs: precheck
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Cache cargo registry & target
        uses: Swatinem/rust-cache@v2

      - name: cargo build
        run: cargo build --all-targets --all-features
