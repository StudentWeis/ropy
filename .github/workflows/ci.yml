name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  precheck:
    name: Precheck (fmt + clippy + test + i18n/icons/themes)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6

      - name: Install nightly rustfmt
        run: rustup toolchain install nightly --profile minimal --component rustfmt

      - name: Install clippy for the pinned stable toolchain
        # rust-toolchain.toml pins the stable channel, and rustup auto-installs
        # cargo/rustc on first use — but clippy is *not* auto-fetched, so the
        # `cargo clippy` step in scripts/precheck.sh fails on a fresh runner.
        # `rustup show active-toolchain` triggers the auto-install of the pinned
        # toolchain, then we add clippy to it explicitly.
        run: |
          rustup show active-toolchain
          rustup component add clippy

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libatk1.0-dev \
            libgtk-3-dev \
            libgdk-pixbuf2.0-dev \
            libcairo2-dev \
            libpango1.0-dev \
            libxdo-dev \
            libxkbcommon-x11-dev

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Cache cargo registry & target
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-machete
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-machete

      - name: Run precheck (CI mode)
        run: ./scripts/precheck.sh --check

  cross-build:
    name: Cross-platform build (${{ matrix.os }})
    if: github.event_name != 'workflow_dispatch'
    needs: precheck
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - name: Cache cargo registry & target
        uses: Swatinem/rust-cache@v2

      - name: cargo build
        run: cargo build --all-targets --all-features

  package-desktop:
    name: Package desktop test artifact (${{ matrix.platform }})
    if: github.event_name == 'workflow_dispatch'
    needs: precheck
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            install_dist_command: >-
              curl --proto '=https' --tlsv1.2 -LsSf
              https://github.com/axodotdev/cargo-dist/releases/download/v0.32.0/cargo-dist-installer.sh
              | sh
          - platform: windows-x86_64
            runner: windows-2022
            target: x86_64-pc-windows-msvc
            install_dist_command: >-
              irm
              https://github.com/axodotdev/cargo-dist/releases/download/v0.32.0/cargo-dist-installer.ps1
              | iex

    steps:
      - uses: actions/checkout@v6

      - name: Cache cargo registry & target
        uses: Swatinem/rust-cache@v2
        with:
          key: desktop-test-artifacts-${{ matrix.target }}

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libatk1.0-dev \
            libgtk-3-dev \
            libgdk-pixbuf2.0-dev \
            libcairo2-dev \
            libpango1.0-dev \
            libxdo-dev \
            libxkbcommon-x11-dev

      - name: Install cargo-dist
        run: ${{ matrix.install_dist_command }}

      - id: package
        name: Build packaged artifact
        shell: bash
        run: |
          set -euo pipefail
          dist build \
            --artifacts=local \
            --target="${{ matrix.target }}" \
            --print=linkage \
            --output-format=json \
            > dist-manifest.json

          echo "paths<<EOF" >> "$GITHUB_OUTPUT"
          dist print-upload-files-from-manifest \
            --manifest dist-manifest.json \
            >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Upload packaged artifact
        uses: actions/upload-artifact@v7
        with:
          name: ropy-${{ matrix.platform }}-${{ github.sha }}
          path: |
            ${{ steps.package.outputs.paths }}
            dist-manifest.json
          if-no-files-found: error
          retention-days: 7
