name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  light-check:
    name: Lightweight checks (fmt + resources + scripts + dependencies)
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Install nightly rustfmt
        run: rustup toolchain install nightly --profile minimal --component rustfmt

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install cargo-machete
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-machete

      - name: Run lightweight precheck
        run: ./scripts/precheck.sh --check --light

  precheck:
    name: Linux (clippy + test + docs)
    needs: light-check
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - name: Install clippy for the pinned toolchain
        run: |
          rustup show active-toolchain
          rustup component add clippy

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libatk1.0-dev \
            libgtk-3-dev \
            libgdk-pixbuf2.0-dev \
            libcairo2-dev \
            libpango1.0-dev \
            libxdo-dev \
            libxkbcommon-x11-dev

      - name: Cache cargo registry & target
        uses: Swatinem/rust-cache@v2
        with:
          # PRs restore main's cache without paying to upload a branch-local copy.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Run Rust precheck
        run: ./scripts/precheck.sh --check --rust

  cross-build:
    # Keep the existing check names for branch protection compatibility.
    name: Cross-platform build (${{ matrix.os }})
    needs: light-check
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - name: Install pinned toolchain
        run: rustup show active-toolchain

      - name: Cache cargo registry & target
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build all targets
        run: cargo build --all-targets --all-features

      - name: Run unit tests
        run: cargo test --all-targets --all-features

  ci:
    # Preserve the previous required check, now aggregating every platform.
    name: Precheck (fmt + clippy + test + i18n/icons/themes)
    needs: [light-check, precheck, cross-build]
    if: always()
    runs-on: ubuntu-22.04
    timeout-minutes: 3
    steps:
      - name: Require all checks to pass
        env:
          LIGHT_RESULT: ${{ needs.light-check.result }}
          LINUX_RESULT: ${{ needs.precheck.result }}
          CROSS_RESULT: ${{ needs.cross-build.result }}
        run: |
          test "$LIGHT_RESULT" = success
          test "$LINUX_RESULT" = success
          test "$CROSS_RESULT" = success
