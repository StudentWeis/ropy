name: Update AUR package

on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:
    inputs:
      pkgrel:
        description: Optional pkgrel override (leave empty for automatic)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: aur-ropy-bin
  cancel-in-progress: false

jobs:
  update-aur:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Read latest stable release checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Always resolve latest stable, so a delayed older event cannot downgrade AUR.
          gh release view --repo StudentWeis/ropy --json tagName,isDraft,isPrerelease,assets > "$RUNNER_TEMP/aur-release.json"

      - name: Configure AUR SSH and clone ropy-bin
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          if [ -z "$AUR_SSH_PRIVATE_KEY" ]; then
            echo "::error::AUR_SSH_PRIVATE_KEY secret is not configured"
            exit 1
          fi
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > "$HOME/.ssh/aur_ropy"
          chmod 600 "$HOME/.ssh/aur_ropy"
          # Pinned official aur.archlinux.org RSA host key (SHA256:5s5cIyReIfNNVGRFdDbe3hdYiI5OelHGpw2rOUud3Q8).
          cat <<'EOF' > "$HOME/.ssh/known_hosts"
          aur.archlinux.org ssh-rsa 
          EOF
          chmod 600 "$HOME/.ssh/known_hosts"
          export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/aur_ropy -o UserKnownHostsFile=$HOME/.ssh/known_hosts -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes"
          git clone ssh://aur@aur.archlinux.org/ropy-bin.git aur-repo

      - name: Generate PKGBUILD
        env:
          INPUT_PKGREL: ${{ inputs.pkgrel }}
        run: |
          version="$(jq -r .tagName "$RUNNER_TEMP/aur-release.json")"
          git show "refs/tags/$version:assets/logo.png" > "$RUNNER_TEMP/aur-logo.png"
          cp packaging/aur/ropy-bin/ropy.desktop aur-repo/ropy.desktop

          extra_args=()
          if [ -n "$INPUT_PKGREL" ]; then
            extra_args+=(--pkgrel "$INPUT_PKGREL")
          fi

          python3 scripts/generate_aur_pkgbuild.py \
            --release-json "$RUNNER_TEMP/aur-release.json" \
            --icon "$RUNNER_TEMP/aur-logo.png" \
            --desktop packaging/aur/ropy-bin/ropy.desktop \
            --existing-pkgbuild aur-repo/PKGBUILD \
            "${extra_args[@]}" \
            aur-repo/PKGBUILD

      - name: Validate and generate .SRCINFO in Arch Linux
        run: |
          stage="$RUNNER_TEMP/aur-stage"
          mkdir -p "$stage"
          cp aur-repo/PKGBUILD aur-repo/ropy.desktop "$stage/"
          chmod 0777 "$stage"

          docker run --rm -v "$stage:/work" -w /work archlinux:base-devel bash -euo pipefail -c '
            pacman -Sy --noconfirm --needed desktop-file-utils namcap
            useradd -m builder
            chown -R builder:builder /work
            su -s /bin/bash builder -c "
              set -euo pipefail
              cd /work
              bash -n PKGBUILD
              desktop-file-validate ropy.desktop
              makepkg --verifysource --force
              makepkg --printsrcinfo > .SRCINFO
              namcap PKGBUILD || true
            "
          '
          cp "$stage/.SRCINFO" aur-repo/.SRCINFO

      - name: Commit and push to AUR
        run: |
          export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/aur_ropy -o UserKnownHostsFile=$HOME/.ssh/known_hosts -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes"
          cd aur-repo
          if git diff --quiet -- PKGBUILD .SRCINFO ropy.desktop && [ -z "$(git ls-files --others --exclude-standard)" ]; then
            echo "AUR package is already up to date."
            exit 0
          fi
          pkgver="$(sed -n 's/^pkgver=//p' PKGBUILD)"
          pkgrel="$(sed -n 's/^pkgrel=//p' PKGBUILD)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PKGBUILD .SRCINFO ropy.desktop
          git commit -m "chore(aur): update ropy-bin to ${pkgver}-${pkgrel}"
          git push origin HEAD:master
