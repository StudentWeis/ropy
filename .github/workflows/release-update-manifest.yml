name: Build update manifest

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

permissions:
  contents: read

jobs:
  update-manifest:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          pattern: artifacts-build-local-*
          path: artifacts
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          pattern: artifacts-macos-bundle-*
          path: artifacts
          merge-multiple: true
      - name: Generate update manifest
        env:
          RELEASE_TAG: ${{ fromJson(inputs.plan).announcement_tag }}
          ANNOUNCEMENT_BODY: ${{ fromJson(inputs.plan).announcement_github_body }}
        run: |
          printf '%s' "$ANNOUNCEMENT_BODY" > "$RUNNER_TEMP/notes.txt"
          bash scripts/generate_update_manifest.sh \
            artifacts \
            "$GITHUB_REPOSITORY" \
            "$RELEASE_TAG" \
            "$RUNNER_TEMP/notes.txt" \
            artifacts/latest.json
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Record release package sizes
        env:
          RELEASE_TAG: ${{ fromJson(inputs.plan).announcement_tag }}
        run: python3 scripts/bench.py sizes --directory artifacts --version "$RELEASE_TAG" --output artifacts/bench-sizes.json
      - uses: actions/upload-artifact@v7
        with:
          name: artifacts-update-manifest
          path: |
            artifacts/latest.json
            artifacts/bench-sizes.json
          if-no-files-found: error
