name: Feature Request
description: Propose a new feature or enhancement.
title: "feat: <short summary>"
labels: ["enhancement"]
body:
  - type: textarea
    id: motivation
    attributes:
      label: Motivation
      description: What problem does this solve? Why is it worth doing?
      placeholder: As a user of Ropy, I want ... so that ...
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed Solution
      description: Describe the change. Include UI mockups, API sketches, or pseudo-code if helpful.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Other approaches you considered and why they were rejected.
    validations:
      required: false
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance Criteria
      description: Concrete, testable conditions that mark this issue as done.
      placeholder: |
        - [ ] Setting X is exposed in the Settings panel
        - [ ] Selecting Y triggers Z behavior
        - [ ] Covered by tests in `src/.../tests`
    validations:
      required: true
  - type: dropdown
    id: scope
    attributes:
      label: Scope
      description: Which module is primarily affected?
      options:
        - gui
        - repository
        - clipboard
        - updater
        - i18n
        - config
        - gpui
        - other / cross-cutting
    validations:
      required: true
