[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = []
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Whether to install an updater program
install-updater = false

# Keep release.yml generated; project-specific work uses dist's extension points.
github-build-setup = "../dist-build-setup.yml"
github-custom-job-permissions = { "release-update-manifest" = { contents = "read", actions = "read" } }
global-artifacts-jobs = ["./release-update-manifest"]

# cargo-dist 0.32 defaults to macos-14 for ARM64, which GitHub no longer supports.
# Use the same supported ARM64 runner label as the main CI workflow.
[dist.github-custom-runners]
aarch64-apple-darwin = "macos-latest"

# Keep generated release checkout aligned with the other workflows.
[dist.github-action-commits]
"actions/checkout" = "v7"

[dist.dependencies.apt]
pkg-config = "*"
libxdo-dev = "*"
libxkbcommon-x11-dev = "*"
